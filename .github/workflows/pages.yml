name: Deploy landing page to GitHub Pages

# Serves site/ at https://tklwin.github.io/pyaww/ — the repo's Pages
# project site (repo name "pyaww" = the URL path, so the address is
# unchanged from the tklwin.github.io copy this replaced).
#
# Only the landing page is published: app code, releases and the DMG
# flow are untouched by this workflow.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
